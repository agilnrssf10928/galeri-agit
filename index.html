<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Foto Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        .upload-area:hover {
            background: #f0f0f0;
            border-color: #764ba2;
        }

        .upload-area.dragging {
            background: #e8e8ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-area h3 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #666;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .msg {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .msg.show {
            display: block;
        }

        .msg-success {
            background: #e8f8f0;
            color: #51cf66;
            border: 1px solid #51cf66;
        }

        .msg-error {
            background: #ffe0e0;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-filter {
            background: #f0f0f0;
            color: #333;
        }

        .btn-filter.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-filter:hover {
            transform: translateY(-2px);
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .card-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            background: #f0f0f0;
        }

        .card-info {
            padding: 12px;
        }

        .card-name {
            font-size: 12px;
            color: #333;
            margin-bottom: 5px;
            word-break: break-word;
            font-weight: 600;
        }

        .card-size {
            font-size: 11px;
            color: #999;
            margin-bottom: 8px;
        }

        .card-actions {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-download {
            background: #51cf66;
            color: white;
        }

        .btn-download:hover {
            background: #37b24d;
            transform: scale(1.05);
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
        }

        .btn-delete:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .empty {
            text-align: center;
            padding: 60px 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty h2 {
            color: #333;
            margin-bottom: 8px;
        }

        .empty p {
            color: #999;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Foto Gallery</h1>
            <p>Upload & simpan foto kamu</p>
        </div>

        <div class="upload-section">
            <div id="msgSuccess" class="msg msg-success"></div>
            <div id="msgError" class="msg msg-error"></div>

            <div class="upload-area" id="uploadArea">
                <h3>📤 Upload Foto</h3>
                <p>Drag & drop atau klik untuk pilih</p>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>

            <div class="controls">
                <input 
                    type="text" 
                    id="search" 
                    class="search-box" 
                    placeholder="🔍 Cari foto..."
                >
                <button class="btn btn-filter active" onclick="filter('all')">Semua</button>
                <button class="btn btn-filter" onclick="filter('recent')">Terbaru</button>
                <button class="btn" onclick="clearAll()" style="background: #ff6b6b; color: white;">🗑️ Hapus Semua</button>
            </div>

            <div class="stats">
                <span id="stats">Total: 0 foto | 0 MB</span>
            </div>
        </div>

        <div id="gallery"></div>
    </div>

    <div class="modal" id="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <img id="modalImg" class="modal-img">
    </div>

    <script>
        const STORAGE_KEY = 'photoGallery';
        let currentFilter = 'all';

        // Get all photos
        function getPhotos() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // Save photos
        function savePhotos(photos) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
            render();
        }

        // Upload handlers
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            handleFiles(Array.from(e.dataTransfer.files));
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(Array.from(e.target.files));
            e.target.value = '';
        });

        // Handle files
        function handleFiles(files) {
            const photos = getPhotos();

            files.forEach(file => {
                if (file.size > 10 * 1024 * 1024) {
                    showError(`${file.name} terlalu besar (max 10MB)`);
                    return;
                }

                if (!file.type.startsWith('image/')) {
                    showError(`${file.name} bukan foto!`);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    photos.push({
                        id: Date.now() + Math.random(),
                        name: file.name,
                        size: (file.size / 1024 / 1024).toFixed(2),
                        src: e.target.result,
                        date: new Date().toLocaleString('id-ID')
                    });
                    savePhotos(photos);
                    showSuccess(`✅ ${file.name} berhasil diupload!`);
                };
                reader.readAsDataURL(file);
            });
        }

        // Render gallery
        function render() {
            let photos = getPhotos();

            if (currentFilter === 'recent') {
                photos = photos.slice(-6);
            }

            const searchTerm = document.getElementById('search').value.toLowerCase();
            if (searchTerm) {
                photos = photos.filter(p => p.name.toLowerCase().includes(searchTerm));
            }

            const gallery = document.getElementById('gallery');

            if (photos.length === 0) {
                gallery.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📸</div>
                        <h2>Belum ada foto</h2>
                        <p>Upload foto pertama kamu sekarang!</p>
                    </div>
                `;
                updateStats();
                return;
            }

            gallery.innerHTML = `
                <div class="gallery">
                    ${photos.map(p => `
                        <div class="card">
                            <img src="${p.src}" class="card-image" onclick="openModal('${p.src}')">
                            <div class="card-info">
                                <div class="card-name" title="${p.name}">${p.name}</div>
                                <div class="card-size">📦 ${p.size} MB</div>
                                <div class="card-actions">
                                    <button class="btn-small btn-download" onclick="downloadPhoto('${p.src}', '${p.name}')">⬇️</button>
                                    <button class="btn-small btn-delete" onclick="deletePhoto(${p.id})">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            updateStats();
        }

        // Filter
        function filter(type) {
            currentFilter = type;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        // Download
        function downloadPhoto(src, name) {
            const link = document.createElement('a');
            link.href = src;
            link.download = name;
            link.click();
        }

        // Delete
        function deletePhoto(id) {
            if (!confirm('Hapus foto ini?')) return;
            let photos = getPhotos();
            photos = photos.filter(p => p.id !== id);
            savePhotos(photos);
            showSuccess('✅ Foto dihapus!');
        }

        // Clear all
        function clearAll() {
            if (!confirm('Hapus SEMUA foto?')) return;
            localStorage.removeItem(STORAGE_KEY);
            showSuccess('✅ Semua foto dihapus!');
            render();
        }

        // Modal
        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Messages
        function showSuccess(msg) {
            const el = document.getElementById('msgSuccess');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showError(msg) {
            const el = document.getElementById('msgError');
            el.textContent = '❌ ' + msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        // Stats
        function updateStats() {
            const photos = getPhotos();
            const size = photos.reduce((sum, p) => sum + parseFloat(p.size), 0).toFixed(2);
            document.getElementById('stats').textContent = `Total: ${photos.length} foto | ${size} MB`;
        }

        // Search
        document.getElementById('search').addEventListener('input', render);

        // Init
        render();
    </script>
</body>
</html>
