<script>
    // 🔥 GANTI DENGAN KONFIGURASI FIREBASE KAMU
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "project-id.firebaseapp.com",
        projectId: "project-id",
        storageBucket: "project-id.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();
    const gallery = document.getElementById('gallery');

    // TOMBOL DIKLIK
    document.querySelector('button').addEventListener('click', async function() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        // Validasi file
        if (!file) {
            alert('Pilih file dulu!');
            return;
        }

        // Validasi ukuran (max 50MB)
        if (file.size > 50 * 1024 * 1024) {
            alert('File terlalu besar! Maksimal 50MB.');
            return;
        }

        // Validasi format
        const ext = file.name.split('.').pop().toLowerCase();
        const allowed = ['jpg', 'jpeg', 'png', 'gif', 'mp4', 'mov', 'avi', 'webm'];
        if (!allowed.includes(ext)) {
            alert('Format file tidak didukung!');
            return;
        }

        // Proses upload
        const btn = document.querySelector('button');
        const originalText = btn.innerText;
        btn.innerText = 'Uploading...';
        btn.disabled = true;

        try {
            const storageRef = storage.ref('uploads/' + Date.now() + '_' + file.name);
            await storageRef.put(file);
            alert('Upload berhasil!');
            fileInput.value = ''; // Reset input
            loadGallery();
        } catch (error) {
            alert('Gagal upload: ' + error.message);
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    });

    // Load gallery
    async function loadGallery() {
        gallery.innerHTML = '<div class="empty">Loading...</div>';
        const listRef = storage.ref('uploads/');
        const res = await listRef.listAll();
        
        if (res.items.length === 0) {
            gallery.innerHTML = '<div class="empty">Belum ada upload. Jadilah yang pertama! 🎉</div>';
            return;
        }

        gallery.innerHTML = '';
        for (const item of res.items) {
            const url = await item.getDownloadURL();
            const ext = item.name.split('.').pop().toLowerCase();
            const isVideo = ['mp4', 'mov', 'avi', 'webm'].includes(ext);
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = isVideo ? 
                `<video controls src="${url}" style="width:100%;height:250px;background:#000;"></video>` :
                `<img src="${url}" style="width:100%;height:250px;object-fit:cover;">`;
            gallery.appendChild(card);
        }
    }

    loadGallery();
</script>
