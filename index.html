<!DOCTYPE html>
<html>
<head>
    <title>Public Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .upload-box { background: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 30px; }
        input[type="file"] { padding: 10px; border: 2px dashed #ccc; border-radius: 8px; }
        button { background: #1877f2; color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img, .card video { width: 100%; height: 250px; object-fit: cover; }
        .card video { object-fit: contain; background: #000; }
        .empty { text-align: center; color: #888; padding: 40px; }
    </style>
</head>
<body>
<div class="container">
    <div class="upload-box">
        <h2>📤 Upload Foto / Video</h2>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.mp4,.mov">
        <br><button onclick="uploadFile()">Upload ke Publik</button>
    </div>

    <div class="grid" id="gallery"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
    // 🔥 GANTI DENGAN KONFIGURASI FIREBASE KAMU
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "project-id.firebaseapp.com",
        projectId: "project-id",
        storageBucket: "project-id.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();
    const gallery = document.getElementById('gallery');

    // Upload file
    async function uploadFile() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return alert('Pilih file dulu!');
        
        const storageRef = storage.ref('uploads/' + Date.now() + '_' + file.name);
        await storageRef.put(file);
        alert('Upload berhasil!');
        loadGallery();
    }

    // Load gallery
    async function loadGallery() {
        gallery.innerHTML = '<div class="empty">Loading...</div>';
        const listRef = storage.ref('uploads/');
        const res = await listRef.listAll();
        
        if (res.items.length === 0) {
            gallery.innerHTML = '<div class="empty">Belum ada upload. Jadilah yang pertama! 🎉</div>';
            return;
        }

        gallery.innerHTML = '';
        for (const item of res.items) {
            const url = await item.getDownloadURL();
            const ext = item.name.split('.').pop().toLowerCase();
            const isVideo = ['mp4', 'mov', 'avi', 'webm'].includes(ext);
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = isVideo ? 
                `<video controls src="${url}" style="width:100%;height:250px;background:#000;"></video>` :
                `<img src="${url}" style="width:100%;height:250px;object-fit:cover;">`;
            gallery.appendChild(card);
        }
    }

    loadGallery();
</script>
</body>
</html>
